[project]
name = "atlas-backend"
version = "0.1.0"
description = "Project Atlas backend (modular-monolith API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "ldap3==2.9.1",
    "passlib[argon2]==1.7.4",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==0.25.3",
    "httpx==0.28.1",
    "mypy==1.14.1",
    "ruff==0.9.4",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "backend"

[[tool.mypy.overrides]]
module = ["ldap3.*", "passlib.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
